name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: mattrshaw4-portfolio-website
  DISTRIBUTION_ID: EWMC4MU0OKBBB

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::859493431963:role/portfolio-github-actions-role
          aws-region: us-east-1

      - name: Upload hashed assets (immutable)
        run: aws s3 sync dist/_astro "s3://$BUCKET/_astro" --cache-control "public, max-age=31536000, immutable"

      - name: Upload other static files
        run: aws s3 sync dist "s3://$BUCKET" --exclude "_astro/*" --exclude "*.html" --cache-control "public, max-age=86400"

      - name: Upload HTML last
        run: aws s3 sync dist "s3://$BUCKET" --exclude "*" --include "*.html" --cache-control "public, max-age=0, must-revalidate" --content-type "text/html; charset=utf-8"

      - name: Remove files no longer in the build
        run: aws s3 sync dist "s3://$BUCKET" --delete --size-only

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
